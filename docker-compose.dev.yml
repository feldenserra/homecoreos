services:
  web:
    build:
      context: .
      target: development
    container_name: app_web_dev
    # Host networking so the app can reach host Ollama on 127.0.0.1.
    # Bridge → host is blocked on many Linux firewalls (e.g. ufw), so
    # host.docker.internal times out even when Ollama is healthy.
    network_mode: host
    ports: !reset []
    extra_hosts: !reset []
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    environment:
      # db publishes 5432 on the host; use loopback under host networking.
      DATABASE_URL: postgres://app_runtime:${POSTGRES_PASSWORD:-password}@127.0.0.1:5432/${POSTGRES_DB:-app_local}
      DATABASE_URL_MIGRATE: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@127.0.0.1:5432/${POSTGRES_DB:-app_local}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-ollama}
      AI_MODEL: ${AI_MODEL:-llama3.2}
      AI_API_KEY: ${AI_API_KEY:-ollama}
      AI_BASE_URL: ${AI_BASE_URL:-http://127.0.0.1:11434/v1}
      NODE_ENV: development
    command: yarn dev --hostname 0.0.0.0 --port 3000
    working_dir: /app
    restart: "no"

volumes:
  web_node_modules:
  web_next:
