services:
  web:
    build:
      context: .
      target: development
    container_name: app_web_dev
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    environment:
      DATABASE_URL: postgres://app_runtime:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-app_local}
      DATABASE_URL_MIGRATE: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-app_local}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      NODE_ENV: development
    command: yarn dev --hostname 0.0.0.0 --port 3000
    working_dir: /app
    restart: "no"

volumes:
  web_node_modules:
  web_next:
